<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster - Smart Task Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div class="min-h-full flex flex-col justify-center py-10 px-4 sm:px-6 lg:px-8">
    <main class="w-full max-w-4xl mx-auto space-y-8">
      
      <!-- App Header -->
      <header class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
        <div>
          <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
            TaskMaster
          </h1>
          <p class="text-base text-slate-500 dark:text-slate-400 mt-1">
            Organize your daily workflow in high-priority cards
          </p>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
          class="p-3 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-md transition-all text-xl">
          <span id="theme-icon">🌙</span>
        </button>
      </header>

      <!-- Progress Bar Card -->
      <section aria-label="Completion progress" class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <div class="flex justify-between items-center mb-3 text-base font-semibold">
          <span class="text-slate-700 dark:text-slate-200">Overall Progress</span>
          <span id="progress-percent" class="text-indigo-600 dark:text-indigo-400 font-bold text-lg">0%</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden">
          <div id="progress-bar-fill" class="bg-indigo-600 h-3 rounded-full transition-all duration-300 w-0"></div>
        </div>
      </section>

      <!-- Add Task Form Card -->
      <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 p-6">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Create New Task</h2>
        <form id="task-form" novalidate class="flex flex-col md:flex-row gap-4">
          <div class="flex-1">
            <label for="task-input" class="sr-only">Task description</label>
            <input type="text" id="task-input" name="task" placeholder="What needs to be done?"
              class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base shadow-sm">
          </div>
          <div class="flex gap-3">
            <label for="priority-select" class="sr-only">Priority level</label>
            <select id="priority-select" name="priority"
              class="px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base font-medium shadow-sm">
              <option value="low">Low Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="high">High Priority</option>
            </select>
            <button type="submit"
              class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 focus:bg-indigo-700 text-white font-bold text-base rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 shadow-md transition-all flex items-center gap-2 whitespace-nowrap">
              <span>➕</span> Add Task
            </button>
          </div>
        </form>
        <p id="form-error" class="text-red-500 text-sm mt-3 font-semibold hidden" role="alert"></p>
      </section>

      <!-- Controls Header: Filters, Count & Clear -->
      <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-700 pb-4">
          <!-- Filter Buttons -->
          <nav aria-label="Task filters" class="flex rounded-xl bg-slate-100 dark:bg-slate-900 p-1.5 gap-1.5">
            <button data-filter="all" class="filter-btn px-4 py-2 text-sm font-bold rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              All
            </button>
            <button data-filter="active" class="filter-btn px-4 py-2 text-sm font-bold rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              Active
            </button>
            <button data-filter="completed" class="filter-btn px-4 py-2 text-sm font-bold rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              Completed
            </button>
          </nav>

          <!-- Task Counter & Clear -->
          <div class="flex items-center gap-6">
            <span id="task-counter" class="text-sm font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-900 px-3 py-1.5 rounded-lg">
              0 tasks left
            </span>
            <button id="clear-completed" type="button"
              class="text-sm text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 font-bold focus:outline-none focus:underline">
              Clear Completed
            </button>
          </div>
        </div>

        <!-- Task Big Cards Container -->
        <ul id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Dynamically populated task cards -->
        </ul>

        <!-- Empty State Container -->
        <div id="empty-state" class="py-12 text-center hidden">
          <p class="text-slate-400 dark:text-slate-500 text-5xl mb-3">📋</p>
          <p id="empty-state-text" class="text-slate-500 dark:text-slate-400 font-semibold text-base">
            No tasks found.
          </p>
        </div>
      </section>
    </main>
  </div>

  <!-- Delete Confirmation Modal Dialog -->
  <dialog id="delete-dialog" class="rounded-2xl p-6 bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-2xl backdrop:bg-slate-900/60 max-w-md w-full border border-slate-200 dark:border-slate-700">
    <h3 class="text-xl font-bold mb-3">Confirm Deletion</h3>
    <p class="text-base text-slate-600 dark:text-slate-300 mb-6">
      Are you sure you want to delete this task? This action cannot be undone.
    </p>
    <div class="flex justify-end gap-3">
      <button id="cancel-delete" type="button"
        class="px-5 py-2.5 text-sm font-bold rounded-xl border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        Cancel
      </button>
      <button id="confirm-delete" type="button"
        class="px-5 py-2.5 text-sm font-bold rounded-xl bg-red-600 hover:bg-red-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500 shadow-md">
        Delete Task
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
