<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster - Smart Task Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div class="min-h-full flex flex-col justify-center py-8 sm:px-6 lg:px-8">
    <main class="w-full max-w-2xl mx-auto px-4 sm:px-6">
      
      <!-- App Header -->
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
            TaskMaster
          </h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
            Organize your daily workflow efficiently
          </p>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
          class="p-2.5 rounded-lg bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-all">
          <span id="theme-icon">🌙</span>
        </button>
      </header>

      <!-- Progress Bar (Extra Feature 1) -->
      <section aria-label="Completion progress" class="mb-6 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
        <div class="flex justify-between items-center mb-2 text-sm font-medium">
          <span class="text-slate-600 dark:text-slate-300">Overall Progress</span>
          <span id="progress-percent" class="text-indigo-600 dark:text-indigo-400 font-bold">0%</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div id="progress-bar-fill" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
        </div>
      </section>

      <!-- Add Task Form -->
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 mb-6">
        <form id="task-form" novalidate class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1">
            <label for="task-input" class="sr-only">Task description</label>
            <input type="text" id="task-input" name="task" placeholder="What needs to be done?"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div class="flex gap-2">
            <label for="priority-select" class="sr-only">Priority level</label>
            <select id="priority-select" name="priority"
              class="px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
            <button type="submit"
              class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 focus:bg-indigo-700 text-white font-medium text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 shadow-sm transition-colors whitespace-nowrap">
              Add Task
            </button>
          </div>
        </form>
        <p id="form-error" class="text-red-500 text-xs mt-2 font-medium hidden" role="alert"></p>
      </section>

      <!-- Controls Header: Filters, Count & Clear -->
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
        <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
          <!-- Filter Buttons -->
          <nav aria-label="Task filters" class="flex rounded-lg bg-slate-100 dark:bg-slate-900 p-1 gap-1">
            <button data-filter="all" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              All
            </button>
            <button data-filter="active" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              Active
            </button>
            <button data-filter="completed" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
              Completed
            </button>
          </nav>

          <!-- Task Counter & Clear -->
          <div class="flex items-center gap-4">
            <span id="task-counter" class="text-xs font-medium text-slate-500 dark:text-slate-400">
              0 tasks left
            </span>
            <button id="clear-completed" type="button"
              class="text-xs text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 font-medium focus:outline-none focus:underline">
              Clear Completed
            </button>
          </div>
        </div>

        <!-- Task List Container -->
        <ul id="task-list" class="divide-y divide-slate-200 dark:divide-slate-700">
          <!-- Dynamically populated via render() -->
        </ul>

        <!-- Empty State Container -->
        <div id="empty-state" class="p-8 text-center hidden">
          <p class="text-slate-400 dark:text-slate-500 text-3xl mb-2">📋</p>
          <p id="empty-state-text" class="text-slate-500 dark:text-slate-400 font-medium text-sm">
            No tasks found.
          </p>
        </div>
      </section>
    </main>
  </div>

  <!-- Delete Confirmation Modal Dialog -->
  <dialog id="delete-dialog" class="rounded-xl p-6 bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xl backdrop:bg-slate-900/50 max-w-sm w-full border border-slate-200 dark:border-slate-700">
    <h2 class="text-lg font-bold mb-2">Delete Task</h2>
    <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">
      Are you sure you want to delete this task? This action cannot be undone.
    </p>
    <div class="flex justify-end gap-3">
      <button id="cancel-delete" type="button"
        class="px-4 py-2 text-sm font-medium rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        Cancel
      </button>
      <button id="confirm-delete" type="button"
        class="px-4 py-2 text-sm font-medium rounded-lg bg-red-600 hover:bg-red-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
        Delete
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
